[package]
name = "panasaurus-wings"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Panasaurus Wings — a high-performance, secure server control daemon for game servers."
repository = "https://github.com/panasaurus/wings"
readme = "README.md"
keywords = ["pterodactyl", "wings", "game-servers", "daemon"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# Core async / serialization
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = { package = "serde-saphyr", version = "1.3" }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }
tracing-appender = "0.2"

# Web server
axum = { version = "0.8", features = ["ws", "multipart", "http2"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["cors", "catch-panic"] }
rustls-acme = { version = "0.15", features = ["axum"] }

# HTTP client (for panel callbacks + remote download pulls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }

# Auth / crypto
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
subtle = "2"
sha2 = "0.10"
hex = "0.4"
hmac = "0.13"
constant_time_eq = "0.6"

# Sandbox / filesystem
cap-std = "4"
cap-fs-ext = "4"
libc = "0.2"
ignore = "0.4"
plist = "1"

# SSH / SFTP
russh = { version = "0.64", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "3"
rand = "0.10"

# Compression / archives
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.13"

# Async utilities
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "rt", "codec"] }
tokio-stream = "0.1"
async-trait = "0.1"

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }

# File search (multi-threaded, content + name search)
walkdir = "2"
grep-regex = "0.1"
regex = "1"
memchr = "2"
aho-corasick = "1"
rayon = "1"

# Misc utilities
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
url = { version = "2", features = ["serde"] }
base64 = "0.22"
human_bytes = "0.4"

# XML / config file parsing (kept from u.zip)
sxd-document = "0.3"
sxd-xpath = "0.4"
quick-xml = "0.41"

# Temp files
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
