[package]
name = "panasaurus-wings"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
cap-std = "4"
libc = "0.2"
ignore = "0.4"
cap-fs-ext = "4"
plist = "1"
chrono = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde-saphyr", version = "1.3" }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

sxd-document = "0.3"
sxd-xpath = "0.4"
regex = "1"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "rt", "codec"] }
tokio-stream = "0.1"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls-acme = { version = "0.15", features = ["axum"] }
russh = { version = "0.64", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "3"
rand = "0.10"

tempfile = "3"

quick-xml = "0.41"

[profile.release]
strip = true
